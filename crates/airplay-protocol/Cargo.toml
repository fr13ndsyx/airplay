[package]
name = "airplay-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fairplay = { path = "../fairplay" }
aes = "0.8"
ctr = "0.9"
cbc = "0.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
sha2 = "0.10"
plist = "1"
thiserror = "1"
tracing = "0.1"
rand = "0.8"
cipher = "0.4"

[dev-dependencies]
pretty_assertions = "1"